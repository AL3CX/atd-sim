<body>
    <main class="intro">
        <div class="box-main">
            <div class="text-center">
                <h1 class="display-2">Military X Letter</h1>

                <div class="note-letter">
                    <div class="note-header">Office of Military X</div>
                    <div class="note-date">xx/xx/xxxx</div>

                    <p>Dear xxxxx,</p>

                    <p>We would like to acknowledge and express our condolences on the loss of your loved one, xxxx. We

                    <p class="signature">Sincerely,
                        <br>Office of Military X
                    </p>
                </div>

            </div>
